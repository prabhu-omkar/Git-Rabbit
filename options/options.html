<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git-Rabbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>

  <!-- Subtle scanlines overlay -->
  <div class="scanlines"></div>

  <main class="terminal">
    <!-- Header -->
    <header class="hdr">
      <div class="hdr__brand">
        <svg class="icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 16a3 3 0 0 1 2.24 5"/>
          <path d="M18 12h.01"/>
          <path d="M18 21h-8a4 4 0 0 1-4-4 7 7 0 0 1 7-7h.2L9.6 6.4a1.01 1.01 0 0 1-.1-1.52L11 3a2.02 2.02 0 0 1 2.87 0l2.56 2.56a2.01 2.01 0 0 1 0 2.87L14.7 10"/>
        </svg>
        <span>GIT-RABBIT</span>
      </div>
      <div class="hdr__status" id="statusIndicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">DISCONNECTED</span>
      </div>
    </header>

    <div class="divider"></div>



    <form id="configForm" autocomplete="off">
      
      <!-- Token Field -->
      <div class="field">
        <div class="field__lbl">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          AUTH_TOKEN
        </div>
        <div class="field__input-wrap">
          <input class="input" type="password" id="pat" placeholder="ghp_xxxxxxxx" required spellcheck="false">
          <span class="cursor"></span>
          <button type="button" class="btn-icon" id="togglePat" title="Toggle visibility">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeClosed" class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        
        <!-- Instruction accordion -->
        <div class="accordion">
          <button type="button" class="accordion__toggle" id="guideToggle" title="Token Generation Guide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span>[ ? ]</span>
          </button>
          <div class="accordion__content" id="guidePanel">
            <div class="code-block">
              > Classic Token Required
              > Scopes: [x] repo
              > <a href="https://github.com/settings/tokens/new?scopes=repo&description=Git-Rabbit" target="_blank" rel="noopener">github.com/settings/tokens</a>
            </div>

</body>
</html>
